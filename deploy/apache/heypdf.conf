# heypdf behind Apache httpd 2.4 on the host, with Cloudflare in front — plain HTTP (port 80): redirects only.
# The HTTPS site is ssl-heypdf.conf next to this file. Install both as described in deploy/DEPLOY.md §8:
#
#   sudo install -m 644 deploy/apache/heypdf.conf /etc/httpd/conf.d/zz-heypdf.conf
#
# The "zz-" prefix loads heypdf after the sites already on the server, so it never becomes the first (default) vhost
# Apache answers for unknown host names; check with `sudo httpd -S` that the defaults are still your existing sites.
#
# The vhost has its OWN CustomLog and ErrorLog: a vhost without them writes to the server-wide access_log in the
# "combined" format (browser type, referrer, query strings), and legal/privacy.md promises we keep none of those.
# Keep the format in sync with ssl-heypdf.conf and the privacy policy (tests/test_legal.py checks both).

<VirtualHost *:80>
    ServerName heypdf.edgr.in

    # The visitor's address (not Cloudflare's) in the log: see ssl-heypdf.conf.
    RemoteIPHeader CF-Connecting-IP
    Include /etc/httpd/conf.d/heypdf-cloudflare-ips.inc

    CustomLog /var/log/httpd-heypdf/access.log "%a [%{%Y-%m-%dT%H:%M:%S%z}t] %V \"%m %U\" %>s %B %D"
    ErrorLog /var/log/httpd-heypdf/error.log
    ErrorLogFormat "[%{cu}t] [%-m:%l] [client\ %a] %M"
    LogLevel warn

    # Path and query string are kept (Cloudflare's "Always Use HTTPS" normally answers this before it gets here).
    Redirect permanent / https://heypdf.edgr.in/
</VirtualHost>
