# heypdf behind Apache httpd 2.4 on the host, with Cloudflare in front — the HTTPS site (heypdf.edgr.in target:
# AlmaLinux 10, Apache owns 80/443 for every site, Cloudflare Origin certificate for *.edgr.in). deploy/DEPLOY.md §8:
#
#   sudo install -d -m 750 /var/log/httpd-heypdf
#   sudo install -m 644 deploy/apache/heypdf-cloudflare-ips.inc /etc/httpd/conf.d/heypdf-cloudflare-ips.inc
#   sudo install -m 644 deploy/apache/ssl-heypdf.conf /etc/httpd/conf.d/zz-heypdf-ssl.conf
#   sudo install -m 644 deploy/apache/heypdf.conf     /etc/httpd/conf.d/zz-heypdf.conf
#   sudo install -m 644 deploy/apache/logrotate-heypdf /etc/logrotate.d/heypdf-httpd
#   sudo apachectl -t && sudo systemctl reload httpd && sudo httpd -S
#
# Modules (AlmaLinux loads them by default): ssl, proxy, proxy_http, headers, remoteip, setenvif, log_config.
# The app listens on 127.0.0.1:${HEYPDF_PORT} (HEYP_BIND/HEYP_PORT in /etc/heypdf/heypdf.env — keep the two numbers
# equal; 3000, 3100, 4416, 8100, 8180 (heyp) and 65529 are taken on this server). The variable has its own name, so
# it never collides with another site's Define.
Define HEYPDF_PORT 8181

<VirtualHost *:443>
    ServerName heypdf.edgr.in

    SSLEngine on
    SSLCertificateFile /etc/ssl/edgr/origin.pem
    SSLCertificateKeyFile /etc/ssl/edgr/origin.key
    # Optional: refuse connections that do not come from Cloudflare (Authenticated Origin Pulls, enabled for this
    # host name in the Cloudflare dashboard first; the CA file is Cloudflare's published origin-pull CA).
    #SSLVerifyClient require
    #SSLVerifyDepth 1
    #SSLCACertificateFile /etc/ssl/edgr/authenticated_origin_pull_ca.pem

    # --- the visitor's address ---------------------------------------------------------------------------------
    # Every connection here comes from a Cloudflare edge server. Only from Cloudflare's published ranges is
    # CF-Connecting-IP believed; anyone else is logged and rate-limited under their own address. Without this, the
    # log would record Cloudflare's addresses (and /privacy promises yours), and the app's per-visitor limits
    # (uploads, jobs, AI requests) would be shared by everyone who comes through the same Cloudflare edge.
    RemoteIPHeader CF-Connecting-IP
    Include /etc/httpd/conf.d/heypdf-cloudflare-ips.inc

    # --- logs: what legal/privacy.md says, nothing more ------------------------------------------------------------
    # %a = the visitor's IP (after mod_remoteip; %h would be Cloudflare's), %U = the path WITHOUT the query string;
    # no request or response headers (no browser type, no referrer, no Content-Disposition file names).
    # Rotated daily and deleted after HEYP_LOG_RETENTION_DAYS (14) days by logrotate-heypdf. The directory is not
    # /var/log/httpd, whose stock logrotate rule (weekly, 4 copies) would otherwise also claim these files.
    CustomLog /var/log/httpd-heypdf/access.log "%a [%{%Y-%m-%dT%H:%M:%S%z}t] %V \"%m %U\" %>s %B %D"
    ErrorLog /var/log/httpd-heypdf/error.log
    # Apache's default error format appends ", referer: …" to request errors; this one does not.
    ErrorLogFormat "[%{cu}t] [%-m:%l] [client\ %a] %M"
    LogLevel warn

    # --- to the app ------------------------------------------------------------------------------------------------
    # Cloudflare accepts at most 100 MB per request (Free/Pro); keep HEYP_MAX_UPLOAD_MB below it (90).
    LimitRequestBody 104857600
    # The app takes the client address from the right-most X-Forwarded-For entry its trusted proxy (this Apache, via
    # the edge network's gateway) adds. Drop whatever the visitor or Cloudflare sent, so mod_proxy sends exactly one
    # entry: the visitor's address as mod_remoteip established it.
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Host early
    RequestHeader unset X-Forwarded-Server early
    RequestHeader unset Forwarded early
    # mod_remoteip has already consumed a genuine CF-Connecting-IP; one that is still here was sent by a non-Cloudflare
    # client, so the app never sees it.
    RequestHeader unset CF-Connecting-IP
    # Links the app builds (the scan page's QR code without HEYP_PUBLIC_URL) and its cross-origin guard use Host and
    # X-Forwarded-Proto.
    RequestHeader set X-Forwarded-Proto "https"
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    # Jobs run in the background and report progress over server-sent events with a keep-alive every 15 s, so no
    # request waits for a whole job; 600 s is the longest silence allowed while reading a response (Cloudflare itself
    # gives up after 100 s without a first byte). retry=0: no 60 s back-off after the ~1 s restart of a deploy.
    ProxyPass        / http://127.0.0.1:${HEYPDF_PORT}/ connectiontimeout=5 timeout=600 retry=0
    ProxyPassReverse / http://127.0.0.1:${HEYPDF_PORT}/

    # Server-sent events (job progress, AI text) must reach the browser as they are written: never compressed.
    SetEnvIfNoCase Request_URI "/events$" no-gzip=1 no-brotli=1

    # The app sets Content-Security-Policy, X-Content-Type-Options, Referrer-Policy and Cache-Control itself; only
    # HSTS is added here (turn Cloudflare's own HSTS setting off for this name, or drop this line, not both).
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>
