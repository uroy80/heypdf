# Release: publish multi-arch images to GHCR and deploy.
#
#   push to main  → build every image natively on amd64 + arm64 runners, push by digest, merge into one index
#                   tagged sha-<commit> and main, attest provenance + SBOM (Sigstore, pushed to GHCR),
#                   optionally cosign-sign, then deploy that commit (deploy.yml) when DEPLOY_ENABLED=true.
#   push tag v*   → promote: point X.Y.Z / X.Y / X / latest at the exact index already built from that commit
#                   (same digest, so its attestations stay valid), then create the GitHub Release.
#                   Release flow: merge to main, wait for this workflow, then `git tag -s vX.Y.Z && git push --tags`.
#
# Images: heypdf (Dockerfile, target runtime), heypdf-docs / heypdf-renderer / heypdf-egress (services/<name>/Dockerfile,
# stage "runtime" or the last one). Keep the lists below in sync with ci.yml, deploy.yml and deploy/compose.prod.yml
# (tests/test_delivery.py checks it).
name: Release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NAMESPACE: ghcr.io/uroy80 # must be lowercase

jobs:
  build:
    # Forks run this workflow too, but cannot (and should not) publish to ghcr.io/uroy80.
    if: github.repository == 'uroy80/heypdf' && github.ref_type == 'branch'
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [heypdf, heypdf-docs, heypdf-renderer, heypdf-egress]
        arch: [amd64, arm64]
        include:
          - { image: heypdf, context: . }
          - { image: heypdf-docs, context: services/docs }
          - { image: heypdf-renderer, context: services/renderer }
          - { image: heypdf-egress, context: services/egress }
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm } # native arm64 runner (free for public repositories)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runtime stage
        id: target
        env:
          CONTEXT: ${{ matrix.context }}
        run: |
          if grep -qiE '^FROM[[:space:]].*[[:space:]]AS[[:space:]]+runtime[[:space:]]*$' "$CONTEXT/Dockerfile"; then
            echo "target=runtime" >>"$GITHUB_OUTPUT"
          else
            echo "target=" >>"$GITHUB_OUTPUT"
          fi
      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.image }}
          # heypdf-deploy prunes only images whose image.source is this repository (shared servers).
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ steps.target.outputs.target }}
          platforms: linux/${{ matrix.arch }}
          # org.opencontainers.image.revision = this commit: heypdf-deploy refuses containers built from anything else.
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HEYP_VERSION=${{ steps.meta.outputs.version }}
            HEYP_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.NAMESPACE }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # BuildKit's own (unsigned) provenance would show up as "unknown/unknown" platforms in the merged
          # index; the signed GitHub attestations below replace it.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing certificate (attestations, cosign)
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: true
      matrix:
        image: [heypdf, heypdf-docs, heypdf-renderer, heypdf-egress]
    env:
      IMAGE: ghcr.io/uroy80/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
      - name: Create the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          for d in *; do args+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --annotation "index:org.opencontainers.image.description=heypdf — self-hosted PDF toolbox"
      - name: Resolve the index digest
        id: index
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $IMAGE:sha-$GITHUB_SHA"; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "- \`$IMAGE@$digest\` (sha-$GITHUB_SHA)" >>"$GITHUB_STEP_SUMMARY"
      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.index.outputs.digest }}
          syft-version: v1.54.1
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true
      - name: Install cosign
        if: vars.COSIGN_SIGN == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (cosign keyless, optional)
        if: vars.COSIGN_SIGN == 'true'
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    permissions:
      contents: read
      packages: read
      attestations: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}

  promote:
    if: github.repository == 'uroy80/heypdf' && github.ref_type == 'tag'
    name: Promote ${{ matrix.image }} to ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [heypdf, heypdf-docs, heypdf-renderer, heypdf-egress]
    env:
      IMAGE: ghcr.io/uroy80/${{ matrix.image }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Point the release tags at the tested main build
        run: |
          src="$IMAGE:sha-$GITHUB_SHA"
          if ! docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
            echo "::error::$src does not exist. Tag a commit after the Release workflow published it from main."
            exit 1
          fi
          mapfile -t tags < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          # A single index as the source keeps its digest (verified), so provenance/SBOM attestations still apply.
          docker buildx imagetools create "${args[@]}" "$src"
          for t in "${tags[@]}"; do
            echo "$t → $(docker buildx imagetools inspect "$t" --format '{{json .Manifest.Digest}}')"
          done

  github-release:
    if: github.ref_type == 'tag'
    name: GitHub Release
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the release (generated notes + image digests)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          {
            echo "## Images"
            echo
            for image in heypdf heypdf-docs heypdf-renderer heypdf-egress; do
              digest=$(docker buildx imagetools inspect "ghcr.io/uroy80/$image:sha-$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
              echo "- \`ghcr.io/uroy80/$image:$version\` — \`$digest\`"
            done
            echo
            echo "Verify: \`gh attestation verify oci://ghcr.io/uroy80/heypdf:$version -R $GITHUB_REPOSITORY\`"
            echo
            echo "Source code (AGPL-3.0): this tag. Third-party licences: CREDITS.md."
          } >"$RUNNER_TEMP/notes.md"
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --generate-notes --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
