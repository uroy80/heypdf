name: Bug report
description: Something in heypdf does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not attach private documents** — describe the file (format, size, page
        count, which program made it) or attach a file you are happy to make public.
  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: e.g. Merge PDF, Compress PDF, OCR PDF, Word to PDF
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Drop a 40-page scanned PDF (12 MB) …\n3. …"
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options: [The public site, Self-hosted with Docker, Development checkout]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: '"version" from /api/health, or the image tag/commit you run'
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Safari 19 on iOS 26
