# Dependabot version updates. Security updates are switched on in Settings → Code security.
#
# Notes for this repository:
# - pip: Dependabot reads only *.txt / *.in files, i.e. the top-level pins in requirements*.txt, never the
#   hash-locked *.lock files. The "Relock" workflow (relock.yml) regenerates the locks on its PRs.
#   Transitive packages in the locks are covered by the weekly image scan (ci.yml) instead.
# - docker: Dependabot only sees FROM lines with a literal image, e.g.
#     FROM python:3.12.15-slim-trixie@sha256:… AS pybase
#   (not FROM ${PYTHON_IMAGE}); it then bumps tag and digest together. Python minor/major bumps are ignored.
# - cooldown: wait a week before proposing a brand-new release (most hijacked releases are pulled within days);
#   scripts/lock.sh and services/lock.sh can also refuse anything newer than 14 days (HEYP_LOCK_CUTOFF).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directories: [/, /services/docs, /services/renderer, /services/egress]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directories: [/, /services/docs, /services/renderer, /services/egress]
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: deps

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: deploy
